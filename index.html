<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get to know me</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #FFD37A;
    --gold-deep: #FFB347;
    --ivory: #F5EFE6;
    --void: #050510;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ivory);
    cursor: default;
  }
  canvas { display: block; position: fixed; inset: 0; z-index: 0; }
  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

  /* ---------- CAPTIONS ---------- */
  #captions {
    position: absolute;
    left: 50%;
    bottom: 22vh;
    transform: translateX(-50%);
    width: min(920px, 88vw);
    text-align: center;
    pointer-events: none;
  }

  #captions::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -1.5rem;
    transform: translateX(-50%);
    width: min(780px, 90vw);
    height: 4.5rem;
    background: radial-gradient(
      ellipse at center,
      rgba(5, 5, 16, 0.75) 0%,
      rgba(5, 5, 16, 0.55) 45%,
      rgba(5, 5, 16, 0.0) 100%
    );
    filter: blur(14px);
    pointer-events: none;
    z-index: -1;
    opacity: var(--plate-opacity, 0.7);
    transition: opacity 0.8s ease;
  }

  .caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.2rem, 2.9vw, 2.1rem);
    font-weight: 500;
    letter-spacing: 0.02em;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    padding: 0 1.5rem;
  }
  .caption.show { opacity: 1; transform: translateY(0); }

  
  /* ============================================================
     CAPTION COLORS
     ------------------------------------------------------------
     OLD (blended into the warm image — kept here for reference):

       .caption.student { font-style: italic; color: #dcd7cf; }
       .caption.tutor   { color: #FFD37A; font-style: normal; }

     NEW (cool, high-contrast tones that stand apart from the
     warm golden classroom and the greyscale girl):
     ============================================================ */

  /* The Student — cool off-white, hint of blue */
  .caption.student {
    font-style: italic;
    color: #EEF2F8;
    text-shadow:
      0 0 20px rgba(120, 180, 255, 0.35),
      0 2px 14px rgba(0, 0, 0, 0.95),
      0 1px 2px  rgba(0, 0, 0, 1);
  }

  /* The Tutor — luminous cyan-white, unmistakably not the scene's gold */
  .caption.tutor {
    font-style: normal;
    color: #EAFBFF;
    text-shadow:
      0 0 26px rgba(140, 220, 255, 0.55),
      0 0 60px rgba(140, 220, 255, 0.20),
      0 2px 14px rgba(0, 0, 0, 0.95),
      0 1px 2px  rgba(0, 0, 0, 1);
  }
  /* Speaker label ("THE TUTOR" / "THE STUDENT") */
  .caption .who {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    font-weight: 600;
    opacity: 1;
    text-shadow:
      0 0 12px rgba(0, 0, 0, 0.9),
      0 1px 2px  rgba(0, 0, 0, 1);
  }

  .caption.student .who { color: #A8B6CC; }
  .caption.tutor   .who { color: #7FE2FF; }

  /* ---------- BUTTON ---------- */
  #enterBtn {
    position: absolute;
    left: 50%;
    bottom: 10vh;
    transform: translateX(-50%);
    padding: 1.15rem 3.2rem;
    background: transparent;
    border: 1px solid rgba(255,211,122,0.55);
    border-radius: 60px;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    cursor: pointer;
    pointer-events: auto;
    z-index: 20;
    transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #enterBtn::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 60px;
    border: 1px solid rgba(255,211,122,0.25);
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    transform: scale(0.96);
  }
  #enterBtn:hover {
    color: #fff;
    border-color: var(--gold);
    background: rgba(255,211,122,0.08);
    box-shadow: 0 0 40px rgba(255,211,122,0.55), 0 0 80px rgba(255,179,71,0.25);
    letter-spacing: 0.4em;
  }
  #enterBtn:hover::after { opacity: 1; transform: scale(1.05); }
  #enterBtn.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) scale(1.3);
    filter: blur(6px);
  }

  #hint {
    position: absolute;
    left: 50%;
    bottom: 6vh;
    transform: translateX(-50%);
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255,211,122,0.5);
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
  }
  #hint.show { opacity: 1; }

  /* ---------- FLASH ---------- */
  #flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 55%, #fff 0%, #FFD37A 30%, #FFB347 55%, transparent 80%);
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.9s ease;
  }
  body.warping #flash { opacity: 1; }

  /* ---------- PRELOADER ---------- */
  #preload {
    position: fixed; inset: 0;
    background: var(--void);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000;
    transition: opacity 1.2s ease;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-transform: uppercase;
    text-align: center;
    padding: 1rem;
  }
  #preload.gone { opacity: 0; pointer-events: none; }

  /* ---------- SUBTITLE TOGGLE ---------- */
  #subToggle {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,211,122,0.3);
    color: rgba(255,211,122,0.8);
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 0.5rem 0.9rem;
    border-radius: 30px;
    cursor: pointer;
    pointer-events: auto;
    z-index: 30;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
    font-family: 'Inter', sans-serif;
  }
  #subToggle:hover {
    color: #fff;
    border-color: var(--gold);
    background: rgba(255,211,122,0.1);
  }
  #subToggle.off { opacity: 0.4; }

  /* ============================================================
     RESPONSIVE — MOBILE & TABLET
     Tested breakpoints:
       480px  — small phones (iPhone SE, Galaxy A)
       640px  — mid phones   (iPhone 14, Pixel)
       768px  — large phones / small tablets in portrait
     ============================================================ */

  /* ── All touch / narrow screens (≤ 768px) ──────────────────── */
  @media (max-width: 768px) {

    /* Captions: bigger text, higher position so button doesn't overlap */
    #captions {
      bottom: 28vh;
      width: 92vw;
    }

    .caption {
      /* clamp: min 1rem, preferred 4.2vw, max 1.55rem */
      font-size: clamp(1rem, 4.2vw, 1.55rem);
      line-height: 1.55;
      padding: 0 0.5rem;
    }

    .caption .who {
      font-size: 0.6rem;
      letter-spacing: 0.32em;
      margin-bottom: 0.55rem;
    }

    /* Enter button: smaller padding, tighter letter-spacing */
    #enterBtn {
      bottom: 12vh;
      padding: 1rem 2rem;
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      /* Disable the mouse-magnetic transform on touch — it breaks tap */
      transform: translateX(-50%) !important;
    }

    /* Hint: move up slightly so it's above the safe area */
    #hint {
      bottom: 7vh;
      font-size: 0.62rem;
      letter-spacing: 0.25em;
    }

    /* CC toggle: larger tap target */
    #subToggle {
      top: 1rem;
      right: 1rem;
      padding: 0.55rem 1rem;
      font-size: 0.6rem;
    }

    /* Preloader text: smaller on narrow screens */
    #preload {
      font-size: 0.85rem;
      letter-spacing: 0.35em;
    }
  }

  /* ── Very small phones (≤ 480px) ───────────────────────────── */
  @media (max-width: 480px) {

    #captions {
      bottom: 30vh;
      width: 94vw;
    }

    .caption {
      font-size: clamp(0.95rem, 4.5vw, 1.35rem);
    }

    #enterBtn {
      bottom: 14vh;
      padding: 0.9rem 1.6rem;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
    }

    #hint {
      bottom: 8vh;
      font-size: 0.58rem;
    }
  }

  /* ── Landscape phones (short viewport height ≤ 430px) ──────── */
  @media (max-height: 430px) {

    #captions {
      bottom: 24vh;
    }

    .caption {
      font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    }

    #enterBtn {
      bottom: 8vh;
      padding: 0.75rem 1.4rem;
      font-size: 0.76rem;
    }

    #hint { display: none; } /* not enough room in landscape */
  }
</style>
</head>

<body>
<div id="preload">A story is about to begin…</div>

<div id="ui">
  <button id="subToggle" title="Toggle captions">CC</button>
  <div id="captions"></div>
  <button id="enterBtn">Get to know me</button>
  <div id="hint">Click to begin</div>
</div>

<div id="flash"></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   SCENE
   ===================================================================== */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.014);

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);
camera.position.set(0, 0, 15);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050510, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

/* =====================================================================
   LOAD THE 3 DEPTH LAYERS — graceful fallback if images don't exist yet
   Drop classroom-back.jpg, classroom-mid.jpg, classroom-front.png into
   public/assets/ and they will be used automatically.
   ===================================================================== */
const texLoader = new THREE.TextureLoader();

async function tryLoad(url) {
  try {
    const t = await texLoader.loadAsync(url);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  } catch {
    return null;
  }
}

const [texBack, texMid, texFront] = await Promise.all([
  tryLoad('assets/classroom-back.jpeg'),
  tryLoad('assets/classroom-mid.jpeg'),
  tryLoad('assets/classroom-front.png'),
]);

const hasImages = texBack && texMid && texFront;

/* Fit a plane to the camera frustum at a given depth */
function planeSizeAtDepth(depth, overshoot = 1.15) {
  const vFov = (camera.fov * Math.PI) / 180;
  const height = 2 * Math.tan(vFov / 2) * depth * overshoot;
  const width  = height * camera.aspect;
  return { width, height };
}

/* ── PROCEDURAL FALLBACK ────────────────────────────────────────────────────
   When no images are present we build a dark, moody classroom-like scene
   entirely from procedural geometry: layered planes with canvas textures
   that evoke depth, atmosphere, and the feeling of looking into a room.
   ─────────────────────────────────────────────────────────────────────── */
function makeProceduralTex(drawFn, w = 1024, h = 512) {
  const c   = document.createElement('canvas');
  c.width   = w; c.height = h;
  drawFn(c.getContext('2d'), w, h);
  const t   = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const proceduralBack = hasImages ? texBack : makeProceduralTex((ctx, W, H) => {
  // Dark architectural room: back wall with a faint chalkboard glow
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0,   '#0a0a18');
  bg.addColorStop(0.6, '#08080f');
  bg.addColorStop(1,   '#050508');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Floor line
  ctx.strokeStyle = 'rgba(255,211,122,0.06)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H * 0.72); ctx.lineTo(W, H * 0.72); ctx.stroke();

  // Chalkboard glow on back wall
  const gb = ctx.createRadialGradient(W/2, H*0.38, 0, W/2, H*0.38, W*0.45);
  gb.addColorStop(0,   'rgba(120,160,120,0.07)');
  gb.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = gb; ctx.fillRect(0, 0, W, H);

  // Window light shafts on left
  const gs = ctx.createLinearGradient(0, 0, W*0.18, H);
  gs.addColorStop(0,   'rgba(255,211,122,0.06)');
  gs.addColorStop(1,   'rgba(255,211,122,0)');
  ctx.fillStyle = gs; ctx.fillRect(0, 0, W*0.18, H);

  // Distant silhouettes of seated students
  ctx.fillStyle = 'rgba(10,8,20,0.82)';
  for (let i = 0; i < 9; i++) {
    const x = 80 + i * 100;
    const y = H * 0.56;
    // Head
    ctx.beginPath();
    ctx.ellipse(x, y, 14, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    // Shoulders
    ctx.beginPath();
    ctx.ellipse(x, y + 32, 22, 12, 0, 0, Math.PI * 2);
    ctx.fill();
  }
});

const proceduralMid = hasImages ? texMid : makeProceduralTex((ctx, W, H) => {
  // Transparent — mid-layer is just a depth separator with soft desks
  ctx.clearRect(0, 0, W, H);

  // Desk surfaces catching light
  ctx.fillStyle = 'rgba(255,211,122,0.04)';
  for (let i = 0; i < 5; i++) {
    const x = 60 + i * 180;
    ctx.fillRect(x, H * 0.62, 140, 8);
  }

  // Mid-ground student silhouettes (larger)
  ctx.fillStyle = 'rgba(8,7,18,0.75)';
  for (let i = 0; i < 5; i++) {
    const x = 120 + i * 185;
    const y = H * 0.5;
    ctx.beginPath();
    ctx.ellipse(x, y, 20, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, y + 46, 32, 16, 0, 0, Math.PI * 2);
    ctx.fill();
  }
});

const proceduralFront = hasImages ? texFront : makeProceduralTex((ctx, W, H) => {
  // The student in focus — dark silhouette, warm golden halo behind
  ctx.clearRect(0, 0, W, H);

  // Seat glow — golden warmth pooling around the desk
  const glow = ctx.createRadialGradient(W/2, H*0.7, 0, W/2, H*0.65, W*0.38);
  glow.addColorStop(0,   'rgba(255,211,122,0.22)');
  glow.addColorStop(0.5, 'rgba(255,179,71,0.08)');
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // Desk surface
  ctx.fillStyle = 'rgba(40,28,10,0.85)';
  ctx.fillRect(W*0.25, H*0.68, W*0.5, H*0.06);

  // Open book on desk
  ctx.fillStyle = 'rgba(245,240,220,0.7)';
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.7, W*0.14, H*0.04, -0.08, 0, Math.PI*2);
  ctx.fill();

  // Student body — seated silhouette
  ctx.fillStyle = 'rgba(12,10,22,0.92)';
  // Torso
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.52, 52, 80, 0, 0, Math.PI*2);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.3, 38, 48, 0, 0, Math.PI*2);
  ctx.fill();
  // Hair
  ctx.fillStyle = 'rgba(5,4,12,0.95)';
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.26, 42, 28, 0, 0, Math.PI);
  ctx.fill();
  // Arms
  ctx.fillStyle = 'rgba(12,10,22,0.88)';
  ctx.beginPath();
  ctx.ellipse(W/2-55, H*0.58, 18, 55, 0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(W/2+55, H*0.58, 18, 55, -0.3, 0, Math.PI*2);
  ctx.fill();
});

/* ── Build the three depth planes ──────────────────────────────────────── */
const sizeBack = planeSizeAtDepth(20, 1.25);
const backMat  = new THREE.MeshBasicMaterial({
  map: proceduralBack, transparent: true, opacity: 1.0, depthWrite: false
});
const backPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(sizeBack.width, sizeBack.height), backMat
);
backPlane.position.z = -20;
scene.add(backPlane);

const sizeMid = planeSizeAtDepth(10, 1.10);
const midMat  = new THREE.MeshBasicMaterial({
  map: proceduralMid, transparent: true, opacity: 1.0, depthWrite: false
});
const midPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(sizeMid.width, sizeMid.height), midMat
);
midPlane.position.z = -10;
scene.add(midPlane);

const sizeFront = planeSizeAtDepth(4, 1.0);

const frontUniforms = {
  uMap:     { value: proceduralFront },
  uWarm:    { value: 0.0 },
  uBright:  { value: 1.0 },
  uTime:    { value: 0 },
  uOpacity: { value: 1.0 }
};

const frontMat = new THREE.ShaderMaterial({
  uniforms: frontUniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uMap;
    uniform float uWarm;
    uniform float uBright;
    uniform float uTime;
    uniform float uOpacity;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(uMap, vUv);

      // Golden warm overlay (keeps her greyscale but bathes her in light)
      vec3 gold = vec3(1.0, 0.827, 0.478);
      vec3 warmed = mix(c.rgb, c.rgb * gold * 1.35, uWarm);

      // Gentle breathing brightness
      float breathe = 1.0 + sin(uTime * 0.8) * 0.015;

      vec3 finalColor = warmed * uBright * breathe;

      gl_FragColor = vec4(finalColor, c.a * uOpacity);
    }
  `
});

const frontPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(sizeFront.width, sizeFront.height),
  frontMat
);
frontPlane.position.z = -4;
scene.add(frontPlane);

/* =====================================================================
   HALO — golden 3D glow that grows over her desk
   ===================================================================== */
const haloGroup = new THREE.Group();
haloGroup.position.set(0, -0.4, -3);
scene.add(haloGroup);

const glowCanvas = document.createElement('canvas');
glowCanvas.width = glowCanvas.height = 512;
const gctx = glowCanvas.getContext('2d');
const grd = gctx.createRadialGradient(256,256,0, 256,256,256);
grd.addColorStop(0,    'rgba(255,211,122,1)');
grd.addColorStop(0.25, 'rgba(255,179,71,0.55)');
grd.addColorStop(0.6,  'rgba(255,140,60,0.15)');
grd.addColorStop(1,    'rgba(255,120,40,0)');
gctx.fillStyle = grd;
gctx.fillRect(0,0,512,512);
const glowTex = new THREE.CanvasTexture(glowCanvas);

const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  opacity: 0
}));
glowSprite.scale.set(14, 14, 1);
haloGroup.add(glowSprite);

/* =====================================================================
   AMBIENT PARTICLES — floating dust / sparks
   ===================================================================== */
const particleCount = 260;
const positions = new Float32Array(particleCount * 3);
const velocities = new Float32Array(particleCount);
const sizes = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  positions[i*3+0] = (Math.random() - 0.5) * 40;
  positions[i*3+1] = (Math.random() - 0.5) * 24 - 2;
  positions[i*3+2] = (Math.random() - 0.5) * 20 - 6;
  velocities[i] = 0.004 + Math.random() * 0.012;
  sizes[i] = 0.03 + Math.random() * 0.08;
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const pMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0xFFD37A) }
  },
  vertexShader: `
    attribute float size;
    varying float vAlpha;
    uniform float uTime;
    void main() {
      vec3 p = position;
      p.y += sin(uTime * 0.6 + position.x * 0.3) * 0.15;
      p.x += cos(uTime * 0.4 + position.y * 0.3) * 0.15;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = size * (300.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vAlpha = smoothstep(40.0, 5.0, -mv.z);
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - vec2(0.5));
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(uColor, a * vAlpha * 0.7);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

/* =====================================================================
   MOUSE
   ===================================================================== */
const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('mousemove', (e) => {
  mouse.tx = (e.clientX / window.innerWidth  - 0.5) * 2;
  mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
});
window.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  mouse.tx = (t.clientX / window.innerWidth  - 0.5) * 2;
  mouse.ty = (t.clientY / window.innerHeight - 0.5) * 2;
}, { passive: true });

/* =====================================================================
   THE STORY SCRIPT — 46 seconds, no audio
   Timings are in seconds from when the user clicks the button.
   ===================================================================== */
const SCRIPT = [
  { t: 2.0,  who:'student', line:"I'm here every day." },
  { t: 4.5,  who:'student', line:"Same seat. Same notebook. Same silence." },
  { t: 7.0,  who:'student', line:"I answer every question… in my head. Out loud, I disappear." },

  { t: 10.5, who:'tutor',   line:"I see you.",                                         halo:0.7 },
  { t: 12.5, who:'student', line:"You don't have to say that. I know what I am." },
  { t: 15.5, who:'tutor',   line:"Then tell me. What are you?" },
  { t: 17.5, who:'student', line:"The one who's always almost. Almost ready. Almost good enough. Almost seen." },

  { t: 21.0, who:'tutor',   line:"Almost is not 'never.' And 'not yet' is not 'not ever.'", warm:0.2 },
  { t: 24.0, who:'student', line:"You don't understand —" },
  { t: 25.5, who:'tutor',   line:"I do. I've taught hundreds like you. Not one was foolish. Not one was too late.", warm:0.35, halo:1.0 },
  { t: 29.0, who:'tutor',   line:"They were just minds no one had walked with yet.",       warm:0.5,  halo:1.4 },

  { t: 32.0, who:'student', line:"…Walk with me, then.",                                    warm:0.65, halo:1.8 },
  { t: 34.0, who:'tutor',   line:"I already am.",                                           warm:0.75, halo:2.2 },
  { t: 36.5, who:'tutor',   line:"You are not behind. You are beginning.",                  warm:0.85, halo:2.8, bright:1.15 },
  { t: 39.0, who:'student', line:"Then watch me begin.",                                    warm:0.9,  halo:3.5, bright:1.25 },

  { t: 42.0, who:'student', line:"I was never less than them. I was just waiting to be lit.", warm:1.0, halo:5.0, bright:1.4, warp:true },
  { t: 45.0, who:'student', line:"And now? I burn brighter than the ones who never had to wait." }
];

const WARP_AT          = 46.5;  // seconds — camera plunges
const PAGE_CHANGE_AT   = 49.0;  // seconds — navigate to portfolio.html

/* =====================================================================
   UI ELEMENTS
   ===================================================================== */
const captionsEl = document.getElementById('captions');
const enterBtn   = document.getElementById('enterBtn');
const hint       = document.getElementById('hint');
const subToggle  = document.getElementById('subToggle');
let subtitlesOn  = true;
let playing      = false;
let currentCaption = null;

subToggle.addEventListener('click', () => {
  subtitlesOn = !subtitlesOn;
  subToggle.classList.toggle('off', !subtitlesOn);
  if (!subtitlesOn && currentCaption) currentCaption.classList.remove('show');
});

/* =====================================================================
   ANIMATED SHADER STATE
   ===================================================================== */
const shaderState = {
  warm:   { current: 0.0, target: 0.0 },
  bright: { current: 1.0, target: 1.0 },
  halo:   { current: 0.0, target: 0.0 }
};
function setTarget(key, value) {
  if (shaderState[key]) shaderState[key].target = value;
}

/* =====================================================================
   CAPTION DISPLAY
   ===================================================================== */
function showCaption(who, line) {
  if (!subtitlesOn) return;
  if (currentCaption) {
    currentCaption.classList.remove('show');
    const old = currentCaption;
    setTimeout(() => old.remove(), 1100);
  }
  const el = document.createElement('div');
  el.className = 'caption ' + (who === 'tutor' ? 'tutor' : 'student');
  el.innerHTML = `<span class="who">${who === 'tutor' ? 'The Tutor' : 'The Student'}</span>${line}`;
  captionsEl.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  currentCaption = el;
}

/* =====================================================================
   START THE STORY
   ===================================================================== */
function startStory() {
  if (playing) return;
  playing = true;

  enterBtn.classList.add('hidden');
  setTimeout(() => hint.classList.add('show'), 400);
  setTimeout(() => hint.classList.remove('show'), 3200);

  SCRIPT.forEach(entry => {
    setTimeout(() => {
      showCaption(entry.who, entry.line);
      if (typeof entry.warm   === 'number') setTarget('warm',   entry.warm);
      if (typeof entry.bright === 'number') setTarget('bright', entry.bright);
      if (typeof entry.halo   === 'number') setTarget('halo',   entry.halo);
    }, entry.t * 1000);
  });

  // Final warp
  setTimeout(() => {
    document.body.classList.add('warping');
  }, WARP_AT * 1000);

  // Hand off to portfolio
  setTimeout(() => {
    window.location.href = 'portfolio.html';
  }, PAGE_CHANGE_AT * 1000);
}

enterBtn.addEventListener('click', startStory);
// Immediate response on touch — no 300ms delay
enterBtn.addEventListener('touchend', (e) => { e.preventDefault(); startStory(); });

enterBtn.addEventListener('mousemove', (e) => {
  // Disable magnetic effect on touch devices — it permanently offsets the button
  if (window.matchMedia('(pointer: coarse)').matches) return;
  const r = enterBtn.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width  - 0.5) * 8;
  const y = ((e.clientY - r.top)  / r.height - 0.5) * 6;
  enterBtn.style.transform = `translateX(-50%) translate(${x}px, ${y}px)`;
});
enterBtn.addEventListener('mouseleave', () => {
  if (window.matchMedia('(pointer: coarse)').matches) return;
  enterBtn.style.transform = 'translateX(-50%)';
});

// Enter key also starts
window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !playing) startStory();
});

/* =====================================================================
   ANIMATION LOOP
   ===================================================================== */
const clock = new THREE.Clock();
let warping = false;
let warpT = 0;

function easeInCubic(x) {
  x = Math.min(Math.max(x, 0), 1);
  return x * x * x;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.elapsedTime;

  warping = document.body.classList.contains('warping');
  if (warping) warpT = Math.min(warpT + dt, 1.6);

  // Smooth the shader values
  ['warm','bright','halo'].forEach(k => {
    shaderState[k].current += (shaderState[k].target - shaderState[k].current) * 0.03;
  });
  frontUniforms.uWarm.value   = shaderState.warm.current;
  frontUniforms.uBright.value = shaderState.bright.current;
  frontUniforms.uTime.value   = t;

  // Mouse smoothing
  mouse.x += (mouse.tx - mouse.x) * 0.05;
  mouse.y += (mouse.ty - mouse.y) * 0.05;

  // Camera — idle drift + mouse parallax + warp plunge
  const idleX = Math.sin(t * 0.15) * 0.4;
  const idleY = Math.cos(t * 0.12) * 0.25;
  let targetX = idleX + mouse.x * 0.9;
  let targetY = idleY + mouse.y * 0.6;
  let targetZ = 15;

  if (warping) {
    const e = easeInCubic(warpT / 1.6);
    targetZ = 15 - e * 34;
    targetX *= (1 - e);
    targetY *= (1 - e);
  }

  camera.position.x += (targetX - camera.position.x) * 0.06;
  camera.position.y += (targetY - camera.position.y) * 0.06;
  camera.position.z += (targetZ - camera.position.z) * (warping ? 0.05 : 0.08);
  camera.lookAt(0, 0, -6);

  // Plane parallax (each at its own rate → true depth)
  const px = mouse.x * 0.6;
  const py = mouse.y * 0.4;

  backPlane.position.x  = -px * 0.4  + Math.sin(t * 0.10) * 0.15;
  backPlane.position.y  = -py * 0.3  + Math.cos(t * 0.10) * 0.10;

  midPlane.position.x   = -px * 0.9  + Math.sin(t * 0.13) * 0.20;
  midPlane.position.y   = -py * 0.7  + Math.cos(t * 0.13) * 0.15;

  frontPlane.position.x = -px * 1.4  + Math.sin(t * 0.16) * 0.25;
  frontPlane.position.y = -py * 1.1  + Math.cos(t * 0.16) * 0.20;

  // During warp, push planes outward
  if (warping) {
    const e = easeInCubic(warpT / 1.6);
    backPlane.position.z  = -20 - e * 22;
    midPlane.position.z   = -10 + e * 16;
    frontPlane.position.z = -4  + e * 24;

    backPlane.scale.setScalar(1 + e * 0.8);
    midPlane.scale.setScalar(1 + e * 0.5);
    frontPlane.scale.setScalar(1 + e * 0.3);

    backMat.opacity  = 1.0 * (1 - e);
    midMat.opacity   = 1.0 * (1 - e);
    frontUniforms.uOpacity.value = 1.0 * (1 - e * 0.6);
  }

  // Halo
  const h = shaderState.halo.current;
  glowSprite.material.opacity = Math.min(h * 0.18, 0.7);
  glowSprite.scale.setScalar(10 + h * 2.5);
  const breathe = 1 + Math.sin(t * 1.2) * 0.04;
  haloGroup.scale.setScalar(breathe * (1 + h * 0.15));

  // Particles
  pMat.uniforms.uTime.value = t;
  const posArr = pGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArr[i*3+1] += velocities[i] * (0.6 + h * 0.8);
    if (posArr[i*3+1] > 14) {
      posArr[i*3+1] = -14;
      posArr[i*3+0] = (Math.random() - 0.5) * 40;
      posArr[i*3+2] = (Math.random() - 0.5) * 20 - 6;
    }
  }
  pGeo.attributes.position.needsUpdate = true;

  if (warping) {
    const e = easeInCubic(warpT / 1.6);
    pMat.uniforms.uColor.value.setRGB(1, 0.83 + e * 0.17, 0.48 + e * 0.4);
    particles.rotation.z += dt * e * 1.5;
  }

  renderer.render(scene, camera);
}

animate();

/* =====================================================================
   RESIZE
   ===================================================================== */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);

  const sBack = planeSizeAtDepth(20, 1.25);
  backPlane.geometry.dispose();
  backPlane.geometry = new THREE.PlaneGeometry(sBack.width, sBack.height);

  const sMid = planeSizeAtDepth(10, 1.10);
  midPlane.geometry.dispose();
  midPlane.geometry = new THREE.PlaneGeometry(sMid.width, sMid.height);

  const sFront = planeSizeAtDepth(4, 1.0);
  frontPlane.geometry.dispose();
  frontPlane.geometry = new THREE.PlaneGeometry(sFront.width, sFront.height);
});

/* =====================================================================
   PRELOADER
   ===================================================================== */
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('preload').classList.add('gone');
  }, 900);
});
</script>
</body>
</html>
